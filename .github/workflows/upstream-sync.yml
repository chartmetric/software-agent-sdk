---
name: Sync upstream main

on:
    schedule:
        - cron: 17 */6 * * *
    workflow_dispatch:

permissions:
    actions: write
    contents: write

concurrency:
    group: upstream-main-sync
    cancel-in-progress: false

jobs:
    sync:
        if: github.repository == 'chartmetric/software-agent-sdk'
        runs-on: ubuntu-latest
        steps:
            - name: Check out fork main
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: main

            - name: Merge upstream main
              id: merge
              run: |
                  set -euo pipefail
                  git remote add upstream https://github.com/OpenHands/software-agent-sdk.git
                  git fetch --no-tags upstream main

                  if git merge-base --is-ancestor upstream/main HEAD; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git merge --no-edit upstream/main
                  git push origin HEAD:main
                  echo "changed=true" >> "$GITHUB_OUTPUT"

            - name: Build synchronized agent-server image
              if: steps.merge.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run server.yml --ref main
